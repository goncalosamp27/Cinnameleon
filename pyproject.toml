[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinnameleon"
version = "0.1.0"
description = "A lightweight theme profile manager for Linux Mint Cinnamon"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
cinnameleon = "cinnameleon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
